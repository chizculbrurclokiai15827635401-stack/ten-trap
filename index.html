<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<title>Ten Trap - Mobile Prototype</title>
<style>
:root{
  --bg:#111318;
  --panel:#1b1f27;
  --panel2:#242a34;
  --text:#f5f7fb;
  --muted:#aeb7c5;
  --accent:#f0b429;
  --danger:#e05252;
  --safe:#4bbf73;
  --line:#343c49;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#0c0e12 0%,var(--bg) 55%,#0c0e12 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
}
.app{
  width:min(100%,520px);
  min-height:100vh;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom));
}
header{padding:8px 4px 14px;text-align:center}
h1{margin:0;font-size:clamp(28px,8vw,42px);letter-spacing:.05em}
.subtitle{margin-top:4px;color:var(--muted);font-size:14px}
.card{
  background:rgba(27,31,39,.96);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.22);
}
.hidden{display:none!important}
.center{text-align:center}
.statusbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}
.stat{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
}
.stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.stat strong{font-size:16px}
.prompt{font-size:18px;font-weight:700;margin:6px 0 14px;line-height:1.45}
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.num{
  min-height:62px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#202630;
  color:var(--text);
  font-size:24px;
  font-weight:800;
  touch-action:manipulation;
}
.num:active,.action:active,.rps:active{transform:scale(.97)}
.num.owned{
  border-color:#8a6b18;
  background:#3a3117;
  color:#ffd86b;
}
.num.dead{opacity:.46}
.legend{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.5}
.mine-list{
  margin-top:14px;
  padding:12px;
  border-radius:14px;
  background:#151922;
  border:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
}
.mine-list strong{color:var(--text)}
.log{
  margin-top:14px;
  max-height:210px;
  overflow:auto;
  background:#0f1218;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  font-size:13px;
  line-height:1.55;
}
.log div{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.log div:last-child{border-bottom:none}
.rps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rps{
  min-height:76px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-size:16px;
  font-weight:800;
}
.rps span{display:block;font-size:28px;margin-bottom:4px}
.action{
  width:100%;
  min-height:54px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:#16120a;
  font-weight:900;
  font-size:16px;
}
.secondary{background:#2a313d;color:var(--text);border:1px solid var(--line)}
.result-title{font-size:28px;margin:4px 0 8px}
.win{color:#6fe094}.lose{color:#ff7474}.draw{color:#ffd86b}
.rules{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.65}
.flash{animation:flash .45s ease}
@keyframes flash{0%{filter:brightness(1)}50%{filter:brightness(1.45)}100%{filter:brightness(1)}}
@media (max-width:360px){
  .choices{gap:7px}.num{min-height:54px;font-size:21px}.app{padding-left:10px;padding-right:10px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ten Trap</h1>
    <div class="subtitle">その選択が、次の罠になる。</div>
  </header>

  <section id="rpsScreen" class="card">
    <div class="center">
      <div class="prompt">じゃんけんで先攻・後攻を決めます</div>
      <div style="color:var(--muted);font-size:13px">あいこなら再度じゃんけん。決まった順番はゲーム終了まで固定です。</div>
    </div>
    <div class="rps-row">
      <button class="rps" data-rps="rock"><span>✊</span>グー</button>
      <button class="rps" data-rps="scissors"><span>✌️</span>チョキ</button>
      <button class="rps" data-rps="paper"><span>✋</span>パー</button>
    </div>
    <div id="rpsResult" class="mine-list hidden"></div>
    <div class="rules">
      CPUの選択は非公開です。ゲーム中に見えるのは、自分が過去に選んだ番号だけです。
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="statusbar">
      <div class="stat"><small>TURN</small><strong id="turnText">1</strong></div>
      <div class="stat"><small>あなた</small><strong id="orderText">先攻</strong></div>
    </div>

    <div class="card">
      <div id="gamePrompt" class="prompt">番号を1つ選んでください</div>
      <div class="choices" id="choices"></div>
      <div class="legend">黄：あなたが過去に選んだ番号（次ターン以降、自分にとっても地雷）</div>
      <div class="mine-list"><strong>あなたの過去の選択：</strong><span id="mineText">なし</span></div>
      <div class="log" id="log"></div>
    </div>
  </section>

  <section id="resultScreen" class="card hidden center">
    <div id="resultTitle" class="result-title">RESULT</div>
    <div id="resultText" style="line-height:1.7"></div>
    <button id="restartBtn" class="action">最初からやり直す</button>
    <button id="showReplayBtn" class="action secondary">全選択を公開する</button>
    <div id="replay" class="log hidden" style="text-align:left"></div>
  </section>
</div>

<script>
(() => {
  const rpsScreen = document.getElementById('rpsScreen');
  const gameScreen = document.getElementById('gameScreen');
  const resultScreen = document.getElementById('resultScreen');
  const rpsResult = document.getElementById('rpsResult');
  const choicesEl = document.getElementById('choices');
  const turnText = document.getElementById('turnText');
  const orderText = document.getElementById('orderText');
  const mineText = document.getElementById('mineText');
  const gamePrompt = document.getElementById('gamePrompt');
  const logEl = document.getElementById('log');
  const resultTitle = document.getElementById('resultTitle');
  const resultText = document.getElementById('resultText');
  const replayEl = document.getElementById('replay');

  const RPS = ['rock','scissors','paper'];
  const RPS_JP = {rock:'グー',scissors:'チョキ',paper:'パー'};

  let state;

  function resetState(){
    state = {
      turn: 1,
      playerFirst: true,
      playerMines: new Set(),
      cpuMines: new Set(),
      history: [],
      over: false
    };
    logEl.innerHTML = '';
    replayEl.innerHTML = '';
    replayEl.classList.add('hidden');
  }

  function rpsWinner(p,c){
    if(p===c) return 0;
    if((p==='rock'&&c==='scissors')||(p==='scissors'&&c==='paper')||(p==='paper'&&c==='rock')) return 1;
    return -1;
  }

  document.querySelectorAll('.rps').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.rps;
      const c = RPS[Math.floor(Math.random()*RPS.length)];
      const w = rpsWinner(p,c);
      rpsResult.classList.remove('hidden');
      if(w===0){
        rpsResult.innerHTML = `あなた：<strong>${RPS_JP[p]}</strong> ／ CPU：<strong>${RPS_JP[c]}</strong><br>あいこ。もう一度！`;
        return;
      }
      resetState();
      state.playerFirst = w===1;
      rpsResult.innerHTML = `あなた：<strong>${RPS_JP[p]}</strong> ／ CPU：<strong>${RPS_JP[c]}</strong><br>${w===1?'あなたの勝ち。先攻です。':'CPUの勝ち。あなたは後攻です。'}`;
      setTimeout(startGame, 450);
    });
  });

  function startGame(){
    rpsScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    updateUI();
    addLog(`ゲーム開始。あなたは${state.playerFirst?'先攻':'後攻'}。`);
  }

  function updateUI(){
    turnText.textContent = state.turn;
    orderText.textContent = state.playerFirst ? '先攻' : '後攻';
    mineText.textContent = state.playerMines.size ? [...state.playerMines].sort((a,b)=>a-b).join(' / ') : 'なし';
    renderChoices();
    gamePrompt.textContent = `TURN ${state.turn}：番号を1つ選んでください`;
  }

  function renderChoices(){
    choicesEl.innerHTML = '';
    for(let n=1;n<=10;n++){
      const b = document.createElement('button');
      b.className = 'num';
      b.textContent = n;
      if(state.playerMines.has(n)) b.classList.add('owned');
      b.disabled = state.over;
      b.addEventListener('click',()=>playTurn(n));
      choicesEl.appendChild(b);
    }
  }

  function cpuChoose(){
    // Prototype AI: avoids its own known previous picks when possible,
    // otherwise chooses randomly. It cannot know the player's mines.
    const all = Array.from({length:10},(_,i)=>i+1);
    const safeFromOwn = all.filter(n=>!state.cpuMines.has(n));
    const pool = safeFromOwn.length ? safeFromOwn : all;
    return pool[Math.floor(Math.random()*pool.length)];
  }

  function playTurn(playerChoice){
    if(state.over) return;
    disableChoices(true);

    const cpuChoice = cpuChoose();
    const playerHit = state.cpuMines.has(playerChoice);
    const cpuHit = state.playerMines.has(cpuChoice);

    const turnRecord = {
      turn: state.turn,
      playerChoice,
      cpuChoice,
      playerHit,
      cpuHit
    };
    state.history.push(turnRecord);

    // Current turn choices become mines only AFTER hit checks.
    state.playerMines.add(playerChoice);
    state.cpuMines.add(cpuChoice);

    if(playerHit && cpuHit){
      addLog(`TURN ${state.turn}：両者が既存地雷を踏んだ。DRAW。`);
      endGame('draw', turnRecord);
      return;
    }
    if(playerHit){
      addLog(`TURN ${state.turn}：あなたが地雷を踏んだ。`);
      endGame('lose', turnRecord);
      return;
    }
    if(cpuHit){
      addLog(`TURN ${state.turn}：CPUが地雷を踏んだ。あなたの勝ち。`);
      endGame('win', turnRecord);
      return;
    }

    if(playerChoice === cpuChoice){
      addLog(`TURN ${state.turn}：両者生存。同じ番号だったが、このターンでは地雷化前なのでセーフ。`);
    }else{
      addLog(`TURN ${state.turn}：両者生存。`);
    }

    state.turn++;
    setTimeout(()=>{
      updateUI();
      disableChoices(false);
    },300);
  }

  function disableChoices(disabled){
    choicesEl.querySelectorAll('button').forEach(b=>b.disabled=disabled);
  }

  function addLog(text){
    const d = document.createElement('div');
    d.textContent = text;
    logEl.prepend(d);
  }

  function endGame(type, rec){
    state.over = true;
    setTimeout(()=>{
      gameScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');
      resultTitle.className = 'result-title ' + type;
      if(type==='win'){
        resultTitle.textContent='YOU WIN';
        resultText.innerHTML=`CPUが、あなたが過去に選んだ地雷を踏みました。<br>最終ターン：<strong>${rec.turn}</strong>`;
      }else if(type==='lose'){
        resultTitle.textContent='GAME OVER';
        resultText.innerHTML=`あなたはCPUが過去に選んだ地雷を踏みました。<br>選択番号：<strong>${rec.playerChoice}</strong> ／ 最終ターン：<strong>${rec.turn}</strong>`;
      }else{
        resultTitle.textContent='DRAW';
        resultText.innerHTML=`同じターンに両者が既存地雷を踏みました。<br>最終ターン：<strong>${rec.turn}</strong>`;
      }
      resultScreen.classList.add('flash');
      setTimeout(()=>resultScreen.classList.remove('flash'),500);
    },250);
  }

  document.getElementById('restartBtn').addEventListener('click',()=>{
    resetState();
    resultScreen.classList.add('hidden');
    gameScreen.classList.add('hidden');
    rpsScreen.classList.remove('hidden');
    rpsResult.classList.add('hidden');
    rpsResult.innerHTML='';
  });

  document.getElementById('showReplayBtn').addEventListener('click',()=>{
    replayEl.classList.toggle('hidden');
    if(!replayEl.classList.contains('hidden')){
      replayEl.innerHTML='';
      state.history.forEach(h=>{
        const d=document.createElement('div');
        let suffix='';
        if(h.playerHit&&h.cpuHit) suffix=' → 両者地雷';
        else if(h.playerHit) suffix=' → あなたが地雷';
        else if(h.cpuHit) suffix=' → CPUが地雷';
        d.textContent=`TURN ${h.turn}｜あなた：${h.playerChoice}｜CPU：${h.cpuChoice}${suffix}`;
        replayEl.appendChild(d);
      });
    }
  });

  resetState();
})();
</script>
</body>
</html>
